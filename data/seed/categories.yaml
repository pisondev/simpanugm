# Master categories for the first SimpanUGM seed.
# Names and verification questions are Indonesian; CLIP prompts stay in English.
parents:
  - slug: identitas
    name: Identitas dan Kartu
    sort_order: 1
    children:
      - slug: ktm
        name: KTM
        sensitivity: identity
        clip_prompts:
          - a photo of a university student identity card
          - a UGM student card
          - a plastic campus identity card
        verification_questions:
          - key: identity_name_nim
            question: Sebutkan nama dan NIM yang tercetak pada kartu.
            required: true
            check_hint: Nama dan NIM pada kartu sesuai identitas pengklaim.
      - slug: ktp
        name: KTP
        sensitivity: identity
        clip_prompts:
          - a photo of an Indonesian identity card
          - a plastic national identity card
          - an Indonesian KTP card
        verification_questions:
          - key: identity_name_number
            question: Sebutkan nama dan empat digit terakhir nomor identitas.
            required: true
            check_hint: Nama pada kartu sesuai identitas pengklaim.
      - slug: sim
        name: SIM
        sensitivity: identity
        clip_prompts:
          - a photo of an Indonesian driving licence
          - a plastic driving licence card
          - an Indonesian SIM card
        verification_questions:
          - key: driving_name_number
            question: Sebutkan nama dan jenis kendaraan yang tercantum.
            required: true
            check_hint: Nama pada kartu sesuai identitas pengklaim.
      - slug: kartu-atm
        name: Kartu ATM
        sensitivity: identity
        clip_prompts:
          - a photo of a bank card
          - a plastic ATM card
          - a debit card with a bank logo
        verification_questions:
          - key: bank_name_last_four
            question: Sebutkan nama bank dan empat digit terakhir nomor kartu.
            required: true
            check_hint: Nama bank dan empat digit terakhir sesuai bukti pengklaim.
      - slug: kartu-lain
        name: Kartu Lain
        sensitivity: identity
        clip_prompts:
          - a photo of a membership or access card
          - a plastic access card
          - a generic printed card
        verification_questions:
          - key: card_name_purpose
            question: Sebutkan nama atau fungsi kartu dan ciri khususnya.
            required: true
            check_hint: Jawaban cocok dengan kartu yang disimpan.

  - slug: dompet-tas-kecil
    name: Dompet dan Tas Kecil
    sort_order: 2
    children:
      - slug: dompet
        name: Dompet
        sensitivity: valuable
        clip_prompts:
          - a photo of a wallet
          - a folded leather wallet
          - a small personal wallet
        verification_questions:
          - key: wallet_contents
            question: Sebutkan isi dompet yang tidak terlihat dari luar.
            required: true
            check_hint: Isi yang disebut sesuai pemeriksaan petugas.
          - key: wallet_private_mark
            question: Sebutkan ciri khusus di bagian luar atau dalam dompet.
            required: true
            check_hint: Ciri yang disebut terlihat pada barang.
      - slug: tempat-kartu
        name: Tempat Kartu
        sensitivity: valuable
        clip_prompts:
          - a photo of a card holder
          - a slim card wallet
          - a small leather card case
        verification_questions:
          - key: card_holder_contents
            question: Sebutkan kartu atau isi yang tersimpan di dalamnya.
            required: true
            check_hint: Isi yang disebut cocok dengan pemeriksaan petugas.
          - key: card_holder_mark
            question: Sebutkan warna, bahan, dan ciri khusus tempat kartu.
            required: true
            check_hint: Ciri yang disebut terlihat pada barang.
      - slug: pouch
        name: Pouch
        sensitivity: normal
        clip_prompts:
          - a photo of a small pouch
          - a zippered personal pouch
          - a fabric pencil or toiletry pouch
        verification_questions:
          - key: pouch_contents
            question: Sebutkan isi atau benda yang biasanya disimpan di dalamnya.
            required: true
            check_hint: Isi yang disebut cocok dengan pemeriksaan petugas.
          - key: pouch_mark
            question: Sebutkan ciri khusus pada resleting, kain, atau bagian dalam.
            required: true
            check_hint: Ciri yang disebut terlihat pada barang.

  - slug: elektronik
    name: Elektronik
    sort_order: 3
    children:
      - slug: ponsel
        name: Ponsel
        sensitivity: valuable
        clip_prompts:
          - a photo of a smartphone
          - a mobile phone with a case
          - a modern touchscreen phone
        verification_questions:
          - key: phone_model_case
            question: Sebutkan merek, model, dan warna atau ciri casing.
            required: true
            check_hint: Pengklaim dapat membuka kunci atau menunjukkan ciri perangkat.
          - key: phone_private_mark
            question: Sebutkan gambar layar kunci atau ciri khusus lain yang tidak dipublikasikan.
            required: true
            check_hint: Ciri cocok tanpa meminta pengklaim menyebutkan kata sandi.
      - slug: laptop
        name: Laptop
        sensitivity: valuable
        clip_prompts:
          - a photo of a laptop computer
          - a closed notebook computer
          - a personal laptop with a charger
        verification_questions:
          - key: laptop_model_mark
            question: Sebutkan merek, model, dan tanda khusus pada laptop.
            required: true
            check_hint: Tanda cocok dengan perangkat yang disimpan.
          - key: laptop_accessory
            question: Sebutkan aksesori atau stiker yang tidak terlihat pada foto publik.
            required: true
            check_hint: Aksesori cocok dengan pemeriksaan petugas.
      - slug: tablet
        name: Tablet
        sensitivity: valuable
        clip_prompts:
          - a photo of a tablet computer
          - a touchscreen tablet
          - a tablet with a protective cover
        verification_questions:
          - key: tablet_model_cover
            question: Sebutkan merek, model, dan ciri cover tablet.
            required: true
            check_hint: Ciri cocok dengan perangkat yang disimpan.
          - key: tablet_private_mark
            question: Sebutkan tanda khusus di bagian belakang atau layar.
            required: true
            check_hint: Tanda cocok dengan pemeriksaan petugas.
      - slug: earphone
        name: Earphone
        sensitivity: valuable
        clip_prompts:
          - a photo of a small pair of wireless in-ear Bluetooth earbuds with a matching pocket charging case
          - a pair of tiny personal audio earbuds stored in a compact case
          - wireless earphones worn in the ears, with separate left and right earbuds
        verification_questions:
          - key: earphone_case_mark
            question: Sebutkan merek, warna, dan ciri casing atau earphone.
            required: true
            check_hint: Ciri cocok dengan barang yang disimpan.
          - key: earphone_accessory
            question: Sebutkan aksesori atau kerusakan khusus yang tidak terlihat dari luar.
            required: true
            check_hint: Detail cocok dengan pemeriksaan petugas.
      - slug: charger
        name: Charger
        sensitivity: normal
        clip_prompts:
          - a photo of a phone charger
          - a charging adapter and cable
          - a USB power adapter
        verification_questions:
          - key: charger_output
            question: Sebutkan merek, jenis konektor, dan tulisan output charger.
            required: true
            check_hint: Tulisan dan konektor sesuai barang.
      - slug: power-bank
        name: Power Bank
        sensitivity: normal
        clip_prompts:
          - a photo of a portable power bank
          - a USB battery pack
          - a small portable charger
        verification_questions:
          - key: power_bank_capacity
            question: Sebutkan kapasitas, jumlah port, dan ciri casing power bank.
            required: true
            check_hint: Detail sesuai barang.
      - slug: flashdisk
        name: Flashdisk
        sensitivity: normal
        clip_prompts:
          - a photo of a USB flash drive
          - a small thumb drive
          - a portable USB storage device
        verification_questions:
          - key: flashdisk_capacity_mark
            question: Sebutkan kapasitas dan ciri penutup atau gantungan flashdisk.
            required: true
            check_hint: Detail sesuai barang.
      - slug: kalkulator
        name: Kalkulator
        sensitivity: normal
        clip_prompts:
          - a photo of a school calculator
          - a scientific calculator
          - a handheld calculator
        verification_questions:
          - key: calculator_model_mark
            question: Sebutkan merek, model, dan tanda khusus kalkulator.
            required: true
            check_hint: Detail sesuai barang.

