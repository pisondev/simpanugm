version: 2
updates:
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
      day: monday
    groups:
      go:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    groups:
      web:
        patterns: ["*"]
        update-types: [minor, patch]
    commit-message:
      prefix: chore

  - package-ecosystem: uv
    directory: /ml
    schedule:
      interval: weekly
      day: monday
    groups:
      ml:
        patterns: ["*"]
    commit-message:
      prefix: chore

  - package-ecosystem: docker
    directories: [/api, /web, /ml]
    schedule:
      interval: monthly
    commit-message:
      prefix: chore

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: chore
