name: Web checks

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "api/openapi.yaml"
      - ".github/workflows/ci-web.yml"
  pull_request:
    paths:
      - "web/**"
      - "api/openapi.yaml"
      - ".github/workflows/ci-web.yml"

permissions:
  contents: read

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: web

jobs:
  check:
    name: Format, lint, types, tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generated client matches openapi.yaml
        run: pnpm gen && git diff --exit-code src/lib/api/schema.d.ts

      - name: Format
        run: pnpm exec prettier --check .

      - name: Lint
        run: pnpm lint

      - name: Types
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Dependency audit
        run: pnpm audit --prod
