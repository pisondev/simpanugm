name: End to end

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "web/**"
      - "deploy/**"
      - "data/seed/**"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "api/**"
      - "web/**"
      - "deploy/**"
      - "data/seed/**"
      - ".github/workflows/e2e.yml"
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  journeys:
    name: Playwright journeys on the Compose stack
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Start the stack
        run: |
          make env
          docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml -f deploy/compose.e2e.yaml --env-file deploy/env/compose.env up -d --build --wait

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm exec playwright install --with-deps chromium

      - name: Journeys
        working-directory: web
        run: pnpm e2e
        env:
          CI: "true"

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f deploy/compose.yaml -f deploy/compose.dev.yaml -f deploy/compose.e2e.yaml --env-file deploy/env/compose.env logs --no-color > compose.log

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-report
          path: |
            web/playwright-report
            web/test-results
            compose.log
          retention-days: 7
