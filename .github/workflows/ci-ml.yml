name: ML checks

on:
  push:
    branches: [main]
    paths:
      - "ml/**"
      - ".github/workflows/ci-ml.yml"
  pull_request:
    paths:
      - "ml/**"
      - ".github/workflows/ci-ml.yml"

permissions:
  contents: read

concurrency:
  group: ci-ml-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ml

jobs:
  check:
    name: Format, lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      - name: Install
        run: uv sync --frozen

      - name: Format
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Types
        run: uv run mypy app

      - name: Tests
        run: uv run pytest
