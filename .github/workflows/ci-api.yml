name: API checks

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "data/seed/**"
      - "deploy/postgres/**"
      - "deploy/dev-seed/**"
      - ".github/workflows/ci-api.yml"
  pull_request:
    paths:
      - "api/**"
      - "data/seed/**"
      - "deploy/postgres/**"
      - "deploy/dev-seed/**"
      - ".github/workflows/ci-api.yml"

permissions:
  contents: read

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: api

jobs:
  lint:
    name: Format, vet, lint, generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet -tags nodynamic ./... && go vet -tags integration,nodynamic ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.15.0
          working-directory: api

      - name: Generated code matches openapi.yaml and the queries
        run: |
          go generate ./...
          docker run --rm -v "$PWD:/src" -w /src sqlc/sqlc:1.31.1 generate
          git diff --exit-code

      - name: Known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  test:
    name: Unit and integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum

      # nodynamic matches the image: the WASM webp encoder everywhere, never a system libwebp
      - name: Unit tests
        run: go test -tags nodynamic ./...

      # testcontainers starts pgvector/pgvector:pg18 with deploy/postgres/init.sql, the runner has Docker
      - name: Integration tests
        run: go test -tags integration,nodynamic -timeout 15m ./...
