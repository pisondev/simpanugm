name: ML golden tests

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ml-golden-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: ml

jobs:
  golden:
    name: Golden inference tests with real weights
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ml/uv.lock

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ml-weights-${{ hashFiles('ml/models.lock.json') }}
          restore-keys: |
            ml-weights-

      - name: Install dependencies
        run: uv sync --frozen

      - name: Golden tests
        run: uv run pytest -m models
        env:
          HF_HOME: /home/runner/.cache/huggingface
