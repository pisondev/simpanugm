openapi: 3.0.3
info:
  title: SimpanUGM API
  version: 0.1.0
  description: |
    Public API between `web` and `api`. Conventions and the full catalog are in
    docs/architecture/api.md. Errors are RFC 9457 problem details.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
tags:
  - name: auth
  - name: masterdata
  - name: media
  - name: lost
  - name: found
  - name: custody
  - name: search
  - name: notifications
  - name: account
  - name: admin
  - name: matching

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '202':
          description: Accepted. The same answer is given whether or not the email already exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: Email verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      responses:
        '202':
          description: Sent if the account is still unverified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in, session cookie set
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      parameters:
        - name: all
          in: query
          schema: { type: boolean, default: false }
      responses:
        '204':
          description: Signed out
        default: { $ref: '#/components/responses/Problem' }

  /auth/password/forgot:
    post:
      tags: [auth]
      operationId: forgotPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailRequest' }
      responses:
        '202':
          description: Always accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/password/reset:
    post:
      tags: [auth]
      operationId: resetPassword
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPasswordRequest' }
      responses:
        '200':
          description: Password changed, every session revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/invitations/accept:
    post:
      tags: [auth]
      operationId: acceptInvitation
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenPasswordRequest' }
      responses:
        '200':
          description: Account activated and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }

  /me:
    get:
      tags: [auth]
      operationId: getMe
      responses:
        '200':
          description: The signed in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [account]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProfileUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        default: { $ref: '#/components/responses/Problem' }

  /categories:
    get:
      tags: [masterdata]
      operationId: listCategories
      responses:
        '200':
          description: Parent categories with their leaves
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CategoryList' }
        default: { $ref: '#/components/responses/Problem' }

  /zones:
    get:
      tags: [masterdata]
      operationId: listZones
      responses:
        '200':
          description: Zones
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ZoneList' }
        default: { $ref: '#/components/responses/Problem' }

  /locations:
    get:
      tags: [masterdata]
      operationId: listLocations
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: zone_id
          in: query
          schema: { type: string, format: uuid }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        '200':
          description: Active locations, best match first when q is given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocationList' }
        default: { $ref: '#/components/responses/Problem' }

  /posts:
    get:
      tags: [masterdata]
      operationId: listPosts
      description: Public, the help page lists posts and opening hours before sign in
      security: []
      parameters:
        - name: near_location_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Active posts, nearest first when near_location_id is given
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PostList' }
        default: { $ref: '#/components/responses/Problem' }

  /colours:
    get:
      tags: [masterdata]
      operationId: listColours
      responses:
        '200':
          description: Colour palette
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColourList' }
        default: { $ref: '#/components/responses/Problem' }

  /media:
    post:
      tags: [media]
      operationId: uploadMedia
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, purpose]
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  $ref: '#/components/schemas/MediaPurpose'
      responses:
        '201':
          description: Uploaded and processed, staged until attached
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Media' }
        default: { $ref: '#/components/responses/Problem' }

  /media/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      tags: [media]
      operationId: getMedia
      description: Served by a plain handler, excluded from code generation.
      parameters:
        - name: variant
          in: query
          schema:
            type: string
            enum: [thumb, display, original, thumb_blur]
            default: display
      responses:
        '200':
          description: Image bytes
          content:
            image/webp:
              schema: { type: string, format: binary }
            image/jpeg:
              schema: { type: string, format: binary }
        default: { $ref: '#/components/responses/Problem' }
    delete:
      tags: [media]
      operationId: deleteMedia
      responses:
        '204':
          description: Removed
        default: { $ref: '#/components/responses/Problem' }

  /lost-reports:
    post:
      tags: [lost]
      operationId: createLostReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostReportCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostReport' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [lost]
      operationId: listLostReports
      parameters:
        - $ref: '#/components/parameters/Mine'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Members see their own reports. Officers see all unless mine is true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostReportList' }
        default: { $ref: '#/components/responses/Problem' }

  /lost-reports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    get:
      tags: [lost]
      operationId: getLostReport
      responses:
        '200':
          description: The report, projected for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostReport' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [lost]
      operationId: updateLostReport
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LostReportUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostReport' }
        default: { $ref: '#/components/responses/Problem' }

  /lost-reports/{id}/close:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    post:
      tags: [lost]
      operationId: closeLostReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseLostReportRequest' }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LostReport' }
        default: { $ref: '#/components/responses/Problem' }

  /lost-reports/{id}/history:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    get:
      tags: [lost]
      operationId: getLostReportHistory
      responses:
        '200':
          description: Status timeline, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryList' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports:
    post:
      tags: [found]
      operationId: createFoundReport
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoundReportCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        default: { $ref: '#/components/responses/Problem' }
    get:
      tags: [found]
      operationId: listFoundReports
      parameters:
        - $ref: '#/components/parameters/Mine'
        - $ref: '#/components/parameters/StatusFilter'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Members see their own reports. Officers see all unless mine is true
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReportList' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports/public:
    get:
      tags: [found]
      operationId: listPublicFoundReports
      parameters:
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: zone_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Open found items, minimal projection without photos or descriptions
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicFoundItemList' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports/{id}:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    get:
      tags: [found]
      operationId: getFoundReport
      responses:
        '200':
          description: The report, projected for the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        default: { $ref: '#/components/responses/Problem' }
    patch:
      tags: [found]
      operationId: updateFoundReport
      parameters:
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FoundReportUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports/{id}/close:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    post:
      tags: [found]
      operationId: closeFoundReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CloseFoundReportRequest' }
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports/{id}/history:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    get:
      tags: [found]
      operationId: getFoundReportHistory
      responses:
        '200':
          description: Status and custody timeline, oldest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HistoryList' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports/{id}/receive:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    post:
      tags: [custody]
      operationId: receiveFoundReport
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReceiveFoundReportRequest' }
      responses:
        '200':
          description: Received into custody
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FoundReport' }
        default: { $ref: '#/components/responses/Problem' }

  /posts/{id}/inventory:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      tags: [custody]
      operationId: getPostInventory
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [retention_due_at, -received_at]
            default: retention_due_at
      responses:
        '200':
          description: Items in custody at the post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InventoryList' }
        default: { $ref: '#/components/responses/Problem' }

  /search:
    get:
      tags: [search]
      operationId: searchReports
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 200 }
        - name: type
          in: query
          schema:
            type: string
            enum: [lost, found]
        - name: category_id
          in: query
          schema: { type: string, format: uuid }
        - name: zone_id
          in: query
          schema: { type: string, format: uuid }
        - name: location_id
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/StatusFilter'
        - name: custody
          in: query
          schema: { $ref: '#/components/schemas/CustodyStatus' }
        - name: post_id
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Lost and found reports matching the query, most relevant first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SearchResultList' }
        default: { $ref: '#/components/responses/Problem' }

  /notifications:
    get:
      tags: [notifications]
      operationId: listNotifications
      parameters:
        - name: unread
          in: query
          schema: { type: boolean, default: false }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Newest first
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationList' }
        default: { $ref: '#/components/responses/Problem' }

  /notifications/unread-count:
    get:
      tags: [notifications]
      operationId: countUnreadNotifications
      responses:
        '200':
          description: Unread notifications of the caller
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCount' }
        default: { $ref: '#/components/responses/Problem' }

  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: markAllNotificationsRead
      responses:
        '200':
          description: Every unread notification of the caller is read
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UnreadCount' }
        default: { $ref: '#/components/responses/Problem' }

  /notifications/{id}/read:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    post:
      tags: [notifications]
      operationId: markNotificationRead
      responses:
        '204':
          description: Read
        default: { $ref: '#/components/responses/Problem' }

  /notifications/stream:
    get:
      tags: [notifications]
      operationId: streamNotifications
      description: Server Sent Events with events `notification` and `heartbeat`. Resumes after `Last-Event-ID`
      parameters:
        - name: Last-Event-ID
          in: header
          schema: { type: string, maxLength: 40 }
      responses:
        '200':
          description: An open event stream
          content:
            text/event-stream:
              schema: { type: string }
        default: { $ref: '#/components/responses/Problem' }

  /me/email:
    post:
      tags: [account]
      operationId: startEmailChange
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EmailChangeRequest' }
      responses:
        '202':
          description: A confirmation link goes to the new address when it can be used. The answer is the same when it cannot
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /auth/email/confirm:
    post:
      tags: [account]
      operationId: confirmEmailChange
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TokenRequest' }
      responses:
        '200':
          description: The account now uses the new address
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /me/password:
    put:
      tags: [account]
      operationId: changePassword
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PasswordChangeRequest' }
      responses:
        '204':
          description: Changed, every other session is signed out
        default: { $ref: '#/components/responses/Problem' }

  /me/sessions:
    get:
      tags: [account]
      operationId: listMySessions
      responses:
        '200':
          description: Active sessions, the current one flagged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionList' }
        default: { $ref: '#/components/responses/Problem' }

  /me/sessions/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    delete:
      tags: [account]
      operationId: revokeMySession
      responses:
        '204':
          description: Revoked
        default: { $ref: '#/components/responses/Problem' }

  /me/notification-preferences:
    get:
      tags: [account]
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Optional notification groups and their channels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [account]
      operationId: putNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferences' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users:
    get:
      tags: [admin]
      operationId: adminListUsers
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: role
          in: query
          schema: { $ref: '#/components/schemas/Role' }
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Users
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserList' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/invitations:
    post:
      tags: [admin]
      operationId: adminInviteUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InviteUserRequest' }
      responses:
        '201':
          description: Invited, email sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/users/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    patch:
      tags: [admin]
      operationId: adminUpdateUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateUserRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUser' }
        default: { $ref: '#/components/responses/Problem' }

  /lost-reports/{id}/matches:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    get:
      tags: [matching]
      operationId: listLostReportMatches
      parameters:
        - $ref: '#/components/parameters/IncludeLow'
      responses:
        '200':
          description: Candidates projected by role. The owner sees active medium and high candidates in rank order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchList' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports/{id}/matches:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    get:
      tags: [matching]
      operationId: listFoundReportMatches
      parameters:
        - $ref: '#/components/parameters/IncludeLow'
      responses:
        '200':
          description: Candidates of a found report, officers only
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchList' }
        default: { $ref: '#/components/responses/Problem' }

  /found-reports/{id}/match-hint:
    parameters:
      - $ref: '#/components/parameters/IdOrCode'
    get:
      tags: [matching]
      operationId: getFoundReportMatchHint
      responses:
        '200':
          description: AI-05, the item name and category of lost reports with an active high candidate, for the finder
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchHint' }
        default: { $ref: '#/components/responses/Problem' }

  /matches/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    get:
      tags: [matching]
      operationId: getMatch
      responses:
        '200':
          description: One candidate with its explanation, projected by role
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MatchCandidate' }
        default: { $ref: '#/components/responses/Problem' }

  /matches/{id}/feedback:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    post:
      tags: [matching]
      operationId: submitMatchFeedback
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MatchFeedbackRequest' }
      responses:
        '204':
          description: Stored
        default: { $ref: '#/components/responses/Problem' }

  /matches/{id}/dismiss:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    post:
      tags: [matching]
      operationId: dismissMatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DismissMatchRequest' }
      responses:
        '204':
          description: Hidden for the owner, or for everyone when an officer dismisses
        default: { $ref: '#/components/responses/Problem' }

  /reports/{type}/{id}/rematch:
    parameters:
      - name: type
        in: path
        required: true
        schema: { type: string, enum: [lost, found] }
      - $ref: '#/components/parameters/IdOrCode'
    post:
      tags: [matching]
      operationId: rematchReport
      responses:
        '202':
          description: Rescoring queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ack' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/categories:
    get:
      tags: [admin]
      operationId: adminListCategories
      responses:
        '200':
          description: Every category, active or not, parents before their leaves
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategoryList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      operationId: adminCreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/categories/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    patch:
      tags: [admin]
      operationId: adminUpdateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CategoryUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminCategory' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/category-compatibility:
    get:
      tags: [admin]
      operationId: adminListCompatibility
      responses:
        '200':
          description: Every compatibility pair, switched off ones included
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatibilityList' }
        default: { $ref: '#/components/responses/Problem' }
    put:
      tags: [admin]
      operationId: adminPutCompatibility
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CompatibilityPut' }
      responses:
        '200':
          description: Stored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompatibilityPair' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/zones:
    get:
      tags: [admin]
      operationId: adminListZones
      responses:
        '200':
          description: Every zone, active or not
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminZoneList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      operationId: adminCreateZone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminZone' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/zones/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    patch:
      tags: [admin]
      operationId: adminUpdateZone
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ZoneUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminZone' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/locations:
    get:
      tags: [admin]
      operationId: adminListLocations
      parameters:
        - name: q
          in: query
          schema: { type: string, maxLength: 100 }
        - name: zone_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Locations, active or not, at most 500
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocationList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      operationId: adminCreateLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocation' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/locations/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    patch:
      tags: [admin]
      operationId: adminUpdateLocation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocationUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminLocation' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/posts:
    get:
      tags: [admin]
      operationId: adminListPosts
      responses:
        '200':
          description: Every post, active or not
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPostList' }
        default: { $ref: '#/components/responses/Problem' }
    post:
      tags: [admin]
      operationId: adminCreatePost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPost' }
        default: { $ref: '#/components/responses/Problem' }

  /admin/posts/{id}:
    parameters:
      - $ref: '#/components/parameters/UUIDPath'
    patch:
      tags: [admin]
      operationId: adminUpdatePost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PostUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminPost' }
        default: { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: simpan_session

  parameters:
    UUIDPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdOrCode:
      name: id
      in: path
      required: true
      description: UUID or human code such as LST-2611-0007
      schema: { type: string, maxLength: 40 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 100 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: The version from the last read, quoted or bare
      schema: { type: string, maxLength: 20 }
    Mine:
      name: mine
      in: query
      schema: { type: boolean, default: false }
    StatusFilter:
      name: status
      in: query
      style: form
      explode: true
      schema:
        type: array
        maxItems: 10
        items: { type: string, maxLength: 30 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 200 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }

    IncludeLow:
      name: include_low
      in: query
      description: Officers only, adds candidates of tier low (BR-VIS-01)
      schema: { type: boolean, default: false }

  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Problem:
      type: object
      required: [type, title, status, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        code: { type: string }
        detail: { type: string }
        instance: { type: string }
        request_id: { type: string }
        retry_after_seconds: { type: integer }
        errors:
          type: array
          items: { $ref: '#/components/schemas/FieldError' }

    FieldError:
      type: object
      required: [field, code, message]
      properties:
        field: { type: string }
        code: { type: string }
        message: { type: string }

    Ack:
      type: object
      required: [message]
      properties:
        message: { type: string }

    Role:
      type: string
      enum: [member, officer, admin]

    AccountStatus:
      type: string
      enum: [pending_verification, active, suspended, deleted]

    Sensitivity:
      type: string
      enum: [normal, valuable, identity]

    LostStatus:
      type: string
      enum: [reported, potential_match, under_verification, claimed, returned, closed]

    FoundStatus:
      type: string
      enum: [reported, potential_match, under_verification, claimed, returned, unclaimed, closed]

    CustodyStatus:
      type: string
      enum: [with_finder, in_custody, released, disposed, cancelled]

    MediaPurpose:
      type: string
      enum: [lost_report, found_report]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [full_name, email, password, privacy_version, accept_privacy]
      properties:
        full_name: { type: string, maxLength: 100 }
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }
        nim_nip: { type: string, maxLength: 30 }
        phone: { type: string, maxLength: 20 }
        privacy_version: { type: string, maxLength: 20 }
        accept_privacy: { type: boolean }

    TokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token: { type: string, maxLength: 100 }

    TokenPasswordRequest:
      type: object
      additionalProperties: false
      required: [token, password]
      properties:
        token: { type: string, maxLength: 100 }
        password: { type: string, maxLength: 128 }

    EmailRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email: { type: string, maxLength: 254 }

    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 128 }

    Me:
      type: object
      required: [id, email, full_name, role, status, email_verified, claim_restricted, post_ids, permissions]
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        full_name: { type: string }
        nim_nip: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        role: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/AccountStatus' }
        email_verified: { type: boolean }
        claim_restricted: { type: boolean }
        post_ids:
          type: array
          items: { type: string, format: uuid }
        permissions:
          type: array
          items: { type: string }

    VerificationQuestion:
      type: object
      required: [key, question, required]
      properties:
        key: { type: string }
        question: { type: string }
        required: { type: boolean }
        check_hint: { type: string }

    Category:
      type: object
      required: [id, slug, name]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        parent_id: { type: string, format: uuid, nullable: true }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }
        verification_questions:
          type: array
          items: { $ref: '#/components/schemas/VerificationQuestion' }
        children:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    CategoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Category' }

    Zone:
      type: object
      required: [id, slug, name, centroid_lat, centroid_lng]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        centroid_lat: { type: number, format: double }
        centroid_lng: { type: number, format: double }

    ZoneList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Zone' }

    Location:
      type: object
      required: [id, slug, name, aliases, kind, zone_id, zone_name, lat, lng]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        aliases:
          type: array
          items: { type: string }
        kind: { $ref: '#/components/schemas/LocationKind' }
        zone_id: { type: string, format: uuid }
        zone_name: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }

    LocationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Location' }

    Post:
      type: object
      required: [id, slug, name, location_id, location_name, zone_id, zone_name, opening_hours]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        location_id: { type: string, format: uuid }
        location_name: { type: string }
        zone_id: { type: string, format: uuid }
        zone_name: { type: string }
        phone: { type: string, nullable: true }
        opening_hours:
          type: object
          description: Weekday keys mon to sun, each a list of [from, to] in WIB
          additionalProperties:
            type: array
            items:
              type: array
              items: { type: string }
        distance_m: { type: number, format: double, nullable: true }

    PostList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Post' }

    Colour:
      type: object
      required: [name, hex]
      properties:
        name: { type: string }
        hex: { type: string }

    ColourList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Colour' }

    Media:
      type: object
      required: [id, purpose, state, width, height, created_at]
      properties:
        id: { type: string, format: uuid }
        purpose: { $ref: '#/components/schemas/MediaPurpose' }
        state:
          type: string
          enum: [staged, ready, deleted]
        width: { type: integer }
        height: { type: integer }
        created_at: { type: string, format: date-time }

    CategoryRef:
      type: object
      required: [id, slug, name, parent_name, sensitivity]
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        name: { type: string }
        parent_name: { type: string }
        sensitivity: { $ref: '#/components/schemas/Sensitivity' }

    NamedRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }

    PlaceInput:
      type: object
      additionalProperties: false
      properties:
        location_id: { type: string, format: uuid }
        zone_id: { type: string, format: uuid }

    PlaceRef:
      type: object
      properties:
        location: { $ref: '#/components/schemas/NamedRef' }
        zone: { $ref: '#/components/schemas/NamedRef' }

    PhotoRef:
      type: object
      required: [media_id, position]
      properties:
        media_id: { type: string, format: uuid }
        position: { type: integer }

    PersonRef:
      type: object
      required: [full_name]
      properties:
        id: { type: string, format: uuid }
        full_name: { type: string }
        email: { type: string }
        phone: { type: string, nullable: true }
        nim_nip: { type: string, nullable: true }

    ProxyLostInput:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name: { type: string, maxLength: 100 }
        phone: { type: string, maxLength: 20 }

    LostReportCreate:
      type: object
      additionalProperties: false
      required: [category_id, item_name, description, lost_from, lost_until, location_unknown, places, colours, media_ids]
      properties:
        category_id: { type: string, format: uuid }
        item_name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        private_details: { type: string, maxLength: 500 }
        colours:
          type: array
          maxItems: 2
          items: { type: string, maxLength: 30 }
        brand: { type: string, maxLength: 40 }
        lost_from: { type: string, format: date-time }
        lost_until: { type: string, format: date-time }
        location_unknown: { type: boolean }
        places:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/PlaceInput' }
        location_note: { type: string, maxLength: 200 }
        media_ids:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        proxy: { $ref: '#/components/schemas/ProxyLostInput' }

    LostReportUpdate:
      type: object
      additionalProperties: false
      description: Every field is optional. A present field replaces the stored value. An empty string clears an optional text
      properties:
        category_id: { type: string, format: uuid }
        item_name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 1000 }
        private_details: { type: string, maxLength: 500 }
        colours:
          type: array
          maxItems: 2
          items: { type: string, maxLength: 30 }
        brand: { type: string, maxLength: 40 }
        lost_from: { type: string, format: date-time }
        lost_until: { type: string, format: date-time }
        location_unknown: { type: boolean }
        places:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/PlaceInput' }
        location_note: { type: string, maxLength: 200 }
        media_ids:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }

    LostReport:
      type: object
      required: [id, code, status, category, item_name, description, colours, lost_from, lost_until, location_unknown, places, photos, proxy, candidate_count, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: '#/components/schemas/LostStatus' }
        close_reason: { type: string, nullable: true }
        closed_at: { type: string, format: date-time, nullable: true }
        category: { $ref: '#/components/schemas/CategoryRef' }
        item_name: { type: string }
        description: { type: string }
        private_details: { type: string, nullable: true }
        colours:
          type: array
          items: { type: string }
        brand: { type: string, nullable: true }
        lost_from: { type: string, format: date-time }
        lost_until: { type: string, format: date-time }
        location_unknown: { type: boolean }
        places:
          type: array
          items: { $ref: '#/components/schemas/PlaceRef' }
        location_note: { type: string, nullable: true }
        photos:
          type: array
          items: { $ref: '#/components/schemas/PhotoRef' }
        reporter: { $ref: '#/components/schemas/PersonRef' }
        proxy: { type: boolean }
        editable: { type: boolean }
        candidate_count: { type: integer }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    LostReportSummary:
      type: object
      required: [id, code, status, item_name, category_name, lost_until, candidate_count, updated_at]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        status: { $ref: '#/components/schemas/LostStatus' }
        item_name: { type: string }
        category_name: { type: string }
        lost_until: { type: string, format: date-time }
        candidate_count: { type: integer }
        thumb_media_id: { type: string, format: uuid, nullable: true }
        reporter_name: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }

    LostReportList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LostReportSummary' }
        next_cursor: { type: string, nullable: true }

    CloseLostReportRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason:
          type: string
          enum: [found_by_owner, no_longer_needed]
        note: { type: string, maxLength: 500 }

    HistoryEntry:
      type: object
      required: [entity, to_status, transition, actor_kind, created_at]
      properties:
        entity:
          type: string
          enum: [lost_report, found_report, custody]
        from_status: { type: string, nullable: true }
        to_status: { type: string }
        transition: { type: string }
        reason: { type: string, nullable: true }
        actor_kind:
          type: string
          enum: [user, system]
        actor_name: { type: string, nullable: true }
        created_at: { type: string, format: date-time }

    HistoryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/HistoryEntry' }

    CustodyChoice:
      type: object
      additionalProperties: false
      required: [mode]
      properties:
        mode:
          type: string
          enum: [handover, keep]
        intended_post_id: { type: string, format: uuid }

    ProxyFoundInput:
      type: object
      additionalProperties: false
      required: [post_id, storage_slot]
      properties:
        finder_name: { type: string, maxLength: 100 }
        post_id: { type: string, format: uuid }
        storage_slot: { type: string, maxLength: 40 }
        condition_note: { type: string, maxLength: 500 }

    FoundReportCreate:
      type: object
      additionalProperties: false
      required: [category_id, item_name, description, found_at, found_location_id, colours, media_ids, custody]
      properties:
        category_id: { type: string, format: uuid }
        item_name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        hidden_details: { type: string, maxLength: 500 }
        colours:
          type: array
          maxItems: 2
          items: { type: string, maxLength: 30 }
        brand: { type: string, maxLength: 40 }
        found_at: { type: string, format: date-time }
        found_location_id: { type: string, format: uuid }
        location_note: { type: string, maxLength: 200 }
        media_ids:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
        custody: { $ref: '#/components/schemas/CustodyChoice' }
        proxy: { $ref: '#/components/schemas/ProxyFoundInput' }

    FoundReportUpdate:
      type: object
      additionalProperties: false
      description: Every field is optional. A present field replaces the stored value. An empty string clears an optional text
      properties:
        category_id: { type: string, format: uuid }
        item_name: { type: string, maxLength: 80 }
        description: { type: string, maxLength: 500 }
        hidden_details: { type: string, maxLength: 500 }
        colours:
          type: array
          maxItems: 2
          items: { type: string, maxLength: 30 }
        brand: { type: string, maxLength: 40 }
        found_at: { type: string, format: date-time }
        found_location_id: { type: string, format: uuid }
        location_note: { type: string, maxLength: 200 }
        media_ids:
          type: array
          maxItems: 5
          items: { type: string, format: uuid }
