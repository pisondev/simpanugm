version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries:
      - internal/auth/queries.sql
      - internal/masterdata/queries.sql
      - internal/reports/queries.sql
      - internal/media/queries.sql
      - internal/custody/queries.sql
      - internal/search/queries.sql
      - internal/audit/queries.sql
      - internal/platform/idem/queries.sql
      - internal/platform/settings/queries.sql
      - internal/notify/queries.sql
      - internal/matching/queries.sql
    gen:
      go:
        package: sqlc
        out: internal/db/sqlc
        sql_package: pgx/v5
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: uuid
            go_type: github.com/google/uuid.UUID
          - db_type: uuid
            nullable: true
            go_type:
              import: github.com/google/uuid
              type: UUID
              pointer: true
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          # vectors cross the wire as text literals cast in SQL, no vector type is needed in Go
          - db_type: vector
            go_type: string
          - db_type: citext
            go_type: string
          - db_type: citext
            nullable: true
            go_type:
              type: string
              pointer: true
          - db_type: inet
            go_type: net/netip.Addr
          - db_type: inet
            nullable: true
            go_type:
              import: net/netip
              type: Addr
              pointer: true
          - db_type: pg_catalog.numeric
            go_type: float64
          - db_type: pg_catalog.numeric
            nullable: true
            go_type:
              type: float64
              pointer: true
          - db_type: pg_catalog.float8
            go_type: float64
