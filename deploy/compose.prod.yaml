# Production Docker Compose overrides (deployment.md section 2 and 3, US-53)
services:
  postgres:
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 512M
  migrate:
    env_file: !override
      - ./env/live-api.env
    image: ghcr.io/pisondev/simpanugm/api:${VERSION:-latest}
    pull_policy: always
    build: !reset null

  seed:
    env_file: !override
      - ./env/live-api.env
    image: ghcr.io/pisondev/simpanugm/api:${VERSION:-latest}
    pull_policy: always
    build: !reset null

  api:
    env_file: !override
      - ./env/live-api.env
    image: ghcr.io/pisondev/simpanugm/api:${VERSION:-latest}
    pull_policy: always
    build: !reset null
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 384M

  worker:
    env_file: !override
      - ./env/live-api.env
    image: ghcr.io/pisondev/simpanugm/api:${VERSION:-latest}
    pull_policy: always
    build: !reset null
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 384M

  ml:
    env_file: !override
      - ./env/live-ml.env
    profiles: ["local-ml"]
    image: ghcr.io/pisondev/simpanugm/ml:${VERSION:-latest}
    pull_policy: always
    build: !reset null
    deploy:
      resources:
        limits:
          memory: 3072M
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

  web:
    env_file: !override
      - ./env/live-web.env
    image: ghcr.io/pisondev/simpanugm/web:${VERSION:-latest}
    pull_policy: always
    build: !reset null
    environment:
      NODE_ENV: production
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 384M

  caddy:
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-simpanugm.my.id}
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 128M
